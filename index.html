<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>뚝섬·성수 맛집 지도 | Matzip</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍜</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow">🚇 2호선 뚝섬역 · 성수역 <span id="mode-badge" class="mode-badge">데모 모드</span></p>
      <h1>뚝섬·성수 맛집 지도</h1>
      <p class="subtitle">맛집을 등록하고, 별점을 매기고, 함께 공유해요</p>
      <div class="search-wrap">
        <input type="search" id="search" placeholder="가게 이름 · 메뉴 검색" aria-label="검색" />
      </div>
    </div>
  </header>

  <!-- 지도 -->
  <section class="map-section">
    <div id="map" class="map"></div>
    <p id="map-hint" class="map-hint" hidden>
      🗺️ 지도를 보려면 <code>config.js</code>에 카카오 JavaScript 키를 넣어주세요.
      (지금은 목록·등록·별점만 동작합니다.)
    </p>
  </section>

  <!-- 필터 -->
  <nav class="filters" aria-label="필터">
    <div class="filter-row" id="station-filters" aria-label="역 필터">
      <button class="chip active" data-station="all">전체 역</button>
      <button class="chip" data-station="뚝섬역">뚝섬역</button>
      <button class="chip" data-station="성수역">성수역</button>
    </div>
    <div class="filter-row" id="cat-filters" aria-label="카테고리 필터">
      <button class="chip active" data-cat="all">전체</button>
      <button class="chip" data-cat="한식">한식</button>
      <button class="chip" data-cat="양식">양식</button>
      <button class="chip" data-cat="일식">일식</button>
      <button class="chip" data-cat="카페">카페</button>
      <button class="chip" data-cat="술집">술집</button>
    </div>
  </nav>

  <main class="container">
    <div class="list-head">
      <p class="count" id="count"></p>
      <button class="register-btn" id="open-register">+ 맛집 등록</button>
    </div>
    <ul class="grid" id="grid"></ul>
    <p class="empty" id="empty" hidden>조건에 맞는 맛집이 없어요 🥲</p>
  </main>

  <footer class="footer">
    <p>※ 네이버/카카오 별점은 공식 API로 제공되지 않아, 사용자 별점만 표시합니다. · Matzip</p>
  </footer>

  <!-- 등록 모달 -->
  <div class="modal" id="register-modal" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <h2>맛집 등록</h2>
        <button class="close-btn" id="close-modal" aria-label="닫기">✕</button>
      </div>

      <div class="place-search-box" id="place-search-box">
        <label>카카오맵에서 가게 검색</label>
        <div class="ps-row">
          <input type="text" id="place-search" placeholder="예: 성수동 국밥" />
          <button type="button" id="place-search-btn">검색</button>
        </div>
        <ul class="place-results" id="place-results"></ul>
      </div>

      <p class="manual-hint" id="manual-hint" hidden>
        카카오 키가 없어 장소 검색은 비활성화 상태입니다. 정보를 직접 입력해 주세요.
      </p>

      <form id="register-form" class="reg-form">
        <label>가게 이름 *
          <input type="text" id="reg-name" required />
        </label>
        <div class="form-2col">
          <label>카테고리
            <select id="reg-category">
              <option>한식</option>
              <option>양식</option>
              <option>일식</option>
              <option>카페</option>
              <option>술집</option>
            </select>
          </label>
          <label>가까운 역
            <select id="reg-station">
              <option>뚝섬역</option>
              <option>성수역</option>
            </select>
          </label>
        </div>
        <label>주소
          <input type="text" id="reg-address" />
        </label>
        <label>대표 메뉴
          <input type="text" id="reg-menu" placeholder="예: 돼지국밥 · 수육백반" />
        </label>
        <button type="submit" class="submit-btn">등록하기</button>
      </form>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
